# goreleaser v2 configuration for Klarion.
# Docs: https://goreleaser.com — validate locally with `goreleaser check`.
version: 2

project_name: klarion

before:
  hooks:
    - go mod tidy
    # The Action installs the scanner named in action.yml. A release whose
    # action.yml still names the previous version would ship the old binary to
    # everyone pinning the new tag, so refuse to publish it. Snapshots skip.
    - sh -c '[ "{{ .IsSnapshot }}" = "true" ] || sh scripts/check-release-version.sh "{{ .Tag }}"'

builds:
  - id: klarion
    main: ./cmd/klarion
    binary: klarion
    env:
      - CGO_ENABLED=0 # fully static binaries for distroless/scratch images
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    # Inject build metadata into the frozen main.version/commit/date vars.
    ldflags:
      - -s -w
      - -X main.version={{ .Version }}
      - -X main.commit={{ .Commit }}
      - -X main.date={{ .Date }}

archives:
  - id: klarion
    ids:
      - klarion
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}
    # tar.gz everywhere, zip on Windows for native tooling.
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"
  algorithm: sha256

# Keyless cosign signature over checksums.txt.
#
# A checksum file downloaded from the same release it verifies proves the
# archive was not corrupted in transit — it proves nothing about who built it,
# because anyone who can replace the archive can replace the checksums beside
# it. The signature closes that gap: it is issued against this workflow's OIDC
# identity and logged in Rekor, so a consumer can verify the artifact was built
# by this repository's release workflow and not substituted afterwards.
#
# Verify with:
#   cosign verify-blob checksums.txt \
#     --signature checksums.txt.sig --certificate checksums.txt.pem \
#     --certificate-identity-regexp '^https://github\.com/0x1Adi/Klarion/\.github/workflows/release\.yml@refs/tags/v' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
signs:
  - cmd: cosign
    signature: "${artifact}.sig"
    certificate: "${artifact}.pem"
    args:
      - "sign-blob"
      - "--output-signature=${signature}"
      - "--output-certificate=${certificate}"
      - "${artifact}"
      - "--yes"
    artifacts: checksum
    output: true

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"

# Homebrew tap. `brews:` (formulas) was soft-deprecated in goreleaser v2.10,
# formally deprecated in v2.16, and goes away in v3; casks are the supported way
# to ship pre-compiled binaries. No tap_migrations.json is needed because this
# tap never published a formula.
#
# A failure here aborts `release --clean` and takes the binaries and archives
# down with it, so HOMEBREW_TAP_GITHUB_TOKEN must exist on the repo before the
# next tag push: goreleaser hard-errors on an unset .Env key at config load.
homebrew_casks:
  - name: klarion
    ids: [klarion]
    binaries: [klarion]
    directory: Casks
    homepage: "https://github.com/0x1Adi/Klarion"
    description: "Secret scanning that a model verifies. Entropy narrows the search, an LLM decides what is real."
    repository:
      owner: 0x1Adi
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    commit_author:
      name: goreleaser
      email: noreply@github.com
    # No dequarantine hook on purpose. Verified 2026-09-20 on macOS arm64: the cask
    # installs and `klarion version` runs without stripping com.apple.quarantine.
    # A hook here makes goreleaser emit Homebrew's deprecated `postflight` stanza
    # (goreleaser #6870), which prints a "report this to your tap" warning to every
    # installer. Revisit if a user hits Gatekeeper, or when goreleaser v2.19 lands
    # the `postflight_steps` fix.

# DEFERRED — GHCR image. The `dockers:` block and the Buildx + GHCR login steps
# in .github/workflows/release.yml were removed together and must be restored
# together: goreleaser pushes during `release --clean`, so a `dockers:` block
# without a logged-in registry aborts the whole release.

release:
  github:
    owner: 0x1Adi
    name: Klarion
  draft: false
  prerelease: auto
