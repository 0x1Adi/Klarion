<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 392" width="1000" height="392" role="img" aria-label="False positives on flask and rails, the corpora Klarion was tuned against. Klarion 0, trufflehog 9, gitleaks 33, ripsecrets 61, detect-secrets 247. On four ecosystems Klarion had never seen it reports 316 findings across 59,754 files, not zero.">
  <rect width="1000" height="392" rx="16" fill="#14110f"/>

  <text x="40" y="52" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="600" fill="#faf7f2">False positives on flask and rails, 3,700 files of clean code</text>
  <text x="40" y="76" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#968d83">The corpora Klarion was tuned against. Every finding here is noise, so lower is better.</text>

  <text x="40" y="131" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#faf7f2">Klarion</text>
  <rect x="200" y="118" width="5" height="18" rx="2" fill="#a4d4c5"/>
  <text x="218" y="133" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#a4d4c5">0</text>
  <text x="240" y="132" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b635b">with adjudication on</text>

  <text x="40" y="176" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c7bfb5">trufflehog</text>
  <rect x="200" y="163" width="26" height="18" rx="4" fill="#5c6b7f"/>
  <text x="238" y="177" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c7bfb5">9</text>

  <text x="40" y="221" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c7bfb5">gitleaks</text>
  <rect x="200" y="208" width="94" height="18" rx="4" fill="#5c6b7f"/>
  <text x="306" y="222" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c7bfb5">33</text>

  <text x="40" y="266" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c7bfb5">ripsecrets</text>
  <rect x="200" y="253" width="173" height="18" rx="4" fill="#e8b94a"/>
  <text x="385" y="267" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c7bfb5">61</text>

  <text x="40" y="311" font-family="Helvetica, Arial, sans-serif" font-size="15" fill="#c7bfb5">detect-secrets</text>
  <rect x="200" y="298" width="700" height="18" rx="4" fill="#ff4d8b"/>
  <text x="912" y="312" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#c7bfb5">247</text>

  <line x1="40" y1="336" x2="960" y2="336" stroke="#332d28" stroke-width="1"/>
  <text x="40" y="360" font-family="Helvetica, Arial, sans-serif" font-size="12.5" fill="#e8b94a">This is not a general result. On four ecosystems Klarion had never seen, it reports 316 findings across 59,754 files.</text>
  <text x="40" y="380" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#6b635b">Measured 2026-07-09 and 2026-08-08. Method, and the corpora where we do worse, in benchmark/REPORT.md</text>
</svg>
