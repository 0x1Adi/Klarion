<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 430" width="1000" height="430" role="img" aria-label="Klarion pipeline. Stage 1 deterministic detection produces candidates. Stage 2 AI adjudication splits them into real secrets that fail the scan and false positives that are suppressed.">

  <rect width="1000" height="430" rx="16" fill="#14110f"/>

  <text x="40" y="42" font-family="monospace" font-size="12" fill="#968d83">file / diff / agent output</text>
  <path d="M 48 54 L 48 82" stroke="#4a443e" stroke-width="1.5" fill="none"/>

  <!-- Stage 1 -->
  <rect x="40" y="90" width="410" height="128" rx="12" fill="#221e1b" stroke="#332d28" stroke-width="1"/>
  <text x="64" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b635b" letter-spacing="1.4">STAGE 1</text>
  <text x="64" y="146" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#faf7f2">Deterministic detection</text>
  <text x="64" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">Curated rules with a keyword prescreen, then regex,</text>
  <text x="64" y="191" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">then length and allowlist guards. Plus a normalized</text>
  <text x="64" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">Rényi entropy sweep. Fast, and never touches the network.</text>

  <!-- arrow between stages -->
  <path d="M 458 154 L 538 154" stroke="#4a443e" stroke-width="1.5" fill="none"/>
  <text x="462" y="144" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#968d83">candidates</text>

  <!-- Stage 2 -->
  <rect x="550" y="90" width="410" height="128" rx="12" fill="#221e1b" stroke="#332d28" stroke-width="1"/>
  <text x="574" y="118" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#6b635b" letter-spacing="1.4">STAGE 2</text>
  <text x="574" y="146" font-family="Helvetica, Arial, sans-serif" font-size="17" font-weight="600" fill="#faf7f2">AI adjudication</text>
  <text x="574" y="172" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">Each candidate goes to the model in a batch with a few</text>
  <text x="574" y="191" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">lines of surrounding code. It returns a verdict, a</text>
  <text x="574" y="210" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">confidence score and a reason you can read.</text>

  <!-- split -->
  <path d="M 755 226 L 755 250" stroke="#4a443e" stroke-width="1.5" fill="none"/>
  <path d="M 755 250 L 245 250 L 245 282" stroke="#4a443e" stroke-width="1.5" fill="none"/>
  <path d="M 755 250 L 755 282" stroke="#4a443e" stroke-width="1.5" fill="none"/>

  <!-- outcome secret -->
  <rect x="40" y="290" width="410" height="106" rx="12" fill="#221e1b" stroke="#332d28" stroke-width="1"/>
  <text x="64" y="324" font-family="monospace" font-size="15" font-weight="700" fill="#ff4d8b">secret</text>
  <text x="64" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">A real leaked credential. Fails the scan and lands</text>
  <text x="64" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">in your report with the reasoning attached.</text>
  <text x="64" y="388" font-family="monospace" font-size="11" fill="#968d83">uncertain counts as a secret, so it fails safe</text>

  <!-- outcome false positive -->
  <rect x="550" y="290" width="410" height="106" rx="12" fill="#221e1b" stroke="#332d28" stroke-width="1"/>
  <text x="574" y="324" font-family="monospace" font-size="15" font-weight="700" fill="#a4d4c5">false_positive</text>
  <text x="574" y="350" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">A fixture, docs example or non-secret ID.</text>
  <text x="574" y="369" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#c7bfb5">Suppressed once confidence clears the floor.</text>
  <text x="574" y="388" font-family="monospace" font-size="11" fill="#968d83">audit every one with --show-suppressed</text>
  <polygon points="44,76 52,76 48,82" fill="#4a443e"/>
  <polygon points="532,150 532,158 538,154" fill="#4a443e"/>
  <polygon points="241,276 249,276 245,282" fill="#4a443e"/>
  <polygon points="751,276 759,276 755,282" fill="#4a443e"/>
</svg>
