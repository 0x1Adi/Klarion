# Continuous integration for Klarion.
#
# Four jobs: (a) test with race+coverage and format/vet gates, (b) security
# scanning (govulncheck + gosec), (c) a cross-compile matrix to catch
# platform-specific breakage, and (d) a self-scan that dogfoods the binary
# against this repo (fixtures are allowlisted in .klarion.toml, so a clean
# tree exits 0).
#
# Actions are pinned to commit SHAs, not tags. A tag is mutable: whoever
# controls the action's repository can repoint v4 at new code, which then runs
# with this workflow's token. For a security tool that is the minimum bar, and
# the one reviewers check first. The trailing comment records the human-readable
# version each SHA corresponds to.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test (lint + vet + race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true # caches build cache + module downloads

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files need gofmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: Test (race + coverage)
        run: go test ./... -race -coverprofile=coverage.out -covermode=atomic

      - name: Upload coverage artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: coverage
          path: coverage.out
          if-no-files-found: ignore

  security:
    name: Security (govulncheck + gosec)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # Known vulnerabilities in the module graph and in the Go toolchain
      # itself. Reachability-aware, so it only fails on code we actually call.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

      # Static analysis for the usual Go footguns. -exclude-generated keeps it
      # off vendored/generated code; the ruleset is the default one.
      - name: gosec
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@latest
          gosec -exclude-generated -severity medium ./...

  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        goos: [linux, darwin, windows]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: go build -trimpath -o /dev/null ./cmd/klarion

  self-scan:
    name: Self scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build klarion
        run: go build -trimpath -o klarion ./cmd/klarion

      # Fixtures carry documented-fake secrets but are allowlisted in
      # .klarion.toml, so a healthy tree scans clean and exits 0.
      - name: Scan repository
        run: ./klarion scan .
